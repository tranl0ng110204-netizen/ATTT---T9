spring.application.name=backend


# ========================================
# PostgreSQL
# ========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/attt
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver


# ========================================
# JPA
# ========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# ========================================
# Flyway
# ========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ========================================
# AI API key configuration
# ========================================


gemini.api.key=${GEMINI_API_KEY}
# Sử dụng gemini-1.5-flash cho tốc độ siêu nhanh và JSON mode tốt
gemini.api.model=gemini-3.7-flash
# Link API chuẩn của Google
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={key}


